name: MASTER WORLD VIP - Secure Database Update
run-name: MASTER WORLD VIP DB Update · ${{ inputs.request_id || 'manual-bootstrap' }}

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending Supabase migrations (false = dry run only)"
        required: true
        type: boolean
        default: false
      request_id:
        description: "Unique request ID generated by the authenticated Update Center"
        required: false
        type: string
        default: ""
      confirm_project:
        description: "Type MASTER-WORLD-VIP to confirm the target project"
        required: true
        type: string
      backup_confirmed:
        description: "A current recoverable full database backup exists"
        required: true
        type: boolean
        default: false
      restore_tested:
        description: "Backup restore procedure has been successfully tested"
        required: true
        type: boolean
        default: false
      restore_test_reference:
        description: "Non-secret reference to the successful restore test project or test record"
        required: false
        type: string
        default: ""
      backup_reference:
        description: "Non-secret backup ID or record reference; never use a password or signed URL"
        required: false
        type: string
        default: ""
      confirm_apply:
        description: "Type APPLY-MASTER-WORLD-VIP-MIGRATIONS to authorize production changes"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: master-world-vip-supabase-migrations
  cancel-in-progress: false

jobs:
  database-update:
    if: ${{ inputs.confirm_project == 'MASTER-WORLD-VIP' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate request ID
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          if [ -n "$REQUEST_ID" ]; then
            [[ "$REQUEST_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "::error::Invalid request ID"; exit 1; }
          else
            echo "Manual bootstrap run; no app request tracking ID was supplied."
          fi

      - name: Validate required repository secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: lztbbrzeuyjkuiyzrsxp
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::Missing repository Actions secret SUPABASE_ACCESS_TOKEN."; exit 1; }
          [[ "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_[A-Za-z0-9]+$ ]] || { echo "::error::SUPABASE_ACCESS_TOKEN must be a Supabase Personal Access Token beginning with sbp_; do not use a project API key."; exit 1; }
          test -n "${SUPABASE_DB_URL:-}" || { echo "::error::Missing repository Actions secret SUPABASE_DB_URL (IPv4-compatible Supabase Session Pooler connection string)."; exit 1; }
          case "$SUPABASE_DB_URL" in
            *pooler.supabase.com*) ;;
            *) echo "::error::SUPABASE_DB_URL must use the Supabase Session Pooler host for IPv4-compatible GitHub Actions connectivity."; exit 1 ;;
          esac
          test "$SUPABASE_PROJECT_REF" = "lztbbrzeuyjkuiyzrsxp" || { echo "::error::Unexpected Supabase project."; exit 1; }
          echo "Required credentials are present; secret values are never printed."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required migration files
        run: |
          set -euo pipefail
          for migration in \
            202611180001_master_world_vip.sql \
            202611190001_global_community.sql \
            202611190002_privacy_rights.sql \
            20261119180000_admin_rbac_owner_control.sql \
            20261119190000_member_broadcast.sql \
            20261119200000_update_releases.sql \
            20261120100000_inbox_push_foundation.sql \
            20261120150000_membership_helper_hardening.sql \
            20261121100000_profiles_discovery_privacy_hardening.sql \
            20261121120000_facebook_setup_orders.sql \
            20261121130000_facebook_setup_feedback.sql \
            20261121140000_verified_payment_state.sql \
            20261121150000_sslcommerz_checkout_enable.sql \
            20261121160000_trusted_devices_login_history.sql \
            20261121170000_group_rls_recursion_fix.sql \
            20261121180000_member_verification_helpdesk.sql \
            20261121190000_member_live_location.sql \
            20261122100000_messaging_realtime.sql \
            20261123100000_work_earn_job_board.sql \
            202611240001_member_referrals.sql \
            202611240002_public_member_referral_profile.sql \
            202611240003_referral_wallet_rewards.sql \
            202611240004_owner_monthly_compensation.sql \
            202611240005_international_referral_usd_equivalent.sql \
            202611240006_network_admin_referral_rewards.sql \
            202611240007_referral_payout_reference_hardening.sql \
            20261125100000_admin_auto_work_control_plane.sql \
            20261125120000_anti_theft_device_recovery.sql \
            20261125130000_admin_auto_work_claim_concurrency_fix.sql \
            20261125160000_work_earn_wallet_owner_profit.sql; do
            test -f "supabase/migrations/$migration" || { echo "::error::Missing required migration: $migration"; exit 1; }
          done

      - name: Confirm IPv4 Session Pooler configuration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          echo "Using the configured IPv4-compatible Supabase Session Pooler URL."

      - name: Validate pending migrations (dry run)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

      - name: Enforce production backup and approval gates
        if: ${{ inputs.apply_migrations == true }}
        env:
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
          RESTORE_TESTED: ${{ inputs.restore_tested }}
          RESTORE_TEST_REFERENCE: ${{ inputs.restore_test_reference }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail
          test "$BACKUP_CONFIRMED" = "true" || { echo "::error::Apply blocked: a current recoverable full backup was not confirmed."; exit 1; }
          test "$RESTORE_TESTED" = "true" || { echo "::error::Apply blocked: backup restore test was not confirmed."; exit 1; }
          test "${#BACKUP_REFERENCE}" -ge 3 || { echo "::error::Apply blocked: a non-secret backup reference is required."; exit 1; }
          test "${#RESTORE_TEST_REFERENCE}" -ge 3 || { echo "::error::Apply blocked: a non-secret successful restore-test reference is required."; exit 1; }
          test "${#RESTORE_TEST_REFERENCE}" -le 120 || { echo "::error::Restore-test reference is too long."; exit 1; }
          if [[ "$RESTORE_TEST_REFERENCE" =~ (https?://|password|token|secret) ]]; then
            echo "::error::Restore-test reference must be a non-secret identifier, not a URL or credential."
            exit 1
          fi
          test "${#BACKUP_REFERENCE}" -le 120 || { echo "::error::Backup reference is too long."; exit 1; }
          if [[ "$BACKUP_REFERENCE" =~ (https?://|password|token|secret) ]]; then
            echo "::error::Backup reference must be a non-secret identifier, not a URL or credential."
            exit 1
          fi
          test "$CONFIRM_APPLY" = "APPLY-MASTER-WORLD-VIP-MIGRATIONS" || { echo "::error::Apply blocked: exact confirmation phrase is required."; exit 1; }
          echo "Backup, restore-test reference and explicit approval gates passed. References recorded without echoing their values."

      - name: Apply pending production migrations
        if: ${{ inputs.apply_migrations == true && inputs.backup_confirmed == true && inputs.restore_tested == true && inputs.confirm_apply == 'APPLY-MASTER-WORLD-VIP-MIGRATIONS' && inputs.backup_reference != '' && inputs.restore_test_reference != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL" --yes
          echo "Supabase CLI completed the explicitly approved pending migration push."

      - name: Report preview-only run
        if: ${{ inputs.apply_migrations != true }}
        run: echo "Preview only. No database changes were applied."

      - name: Report blocked Apply request
        if: ${{ inputs.apply_migrations == true && (inputs.backup_confirmed != true || inputs.restore_tested != true || inputs.confirm_apply != 'APPLY-MASTER-WORLD-VIP-MIGRATIONS' || inputs.backup_reference == '' || inputs.restore_test_reference == '') }}
        run: |
          echo "::error::Production migration was blocked because one or more backup, restore-test, reference or confirmation gates were incomplete."
          exit 1
