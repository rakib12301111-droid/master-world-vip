name: MASTER WORLD VIP - Read-only Supabase Index and RLS Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-world-vip-supabase-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate approved project and credentials
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MEMBER_A: ${{ secrets.RLS_TEST_MEMBER_A_UUID }}
          SUPABASE_PROJECT_REF: lztbbrzeuyjkuiyzrsxp
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "::error::Missing Actions secret SUPABASE_DB_PASSWORD"; exit 1; }
          test "$SUPABASE_PROJECT_REF" = "lztbbrzeuyjkuiyzrsxp" || { echo "::error::Unexpected project ref"; exit 1; }
          test -n "${MEMBER_A:-}" || { echo "::error::Missing RLS_TEST_MEMBER_A_UUID"; exit 1; }
          [[ "$MEMBER_A" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Member A UUID format invalid"; exit 1; }
          echo "Required credentials are present. Secret values are not printed."

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run read-only production audit
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MEMBER_A: ${{ secrets.RLS_TEST_MEMBER_A_UUID }}
          PGHOST: db.lztbbrzeuyjkuiyzrsxp.supabase.co
          PGPORT: "5432"
          PGDATABASE: postgres
          PGUSER: postgres
          PGSSLMODE: require
        run: |
          set -euo pipefail
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --set=member_a="$MEMBER_A" --file=supabase/audits/production-index-rls-audit.sql
