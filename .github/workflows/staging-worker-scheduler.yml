name: MASTER WORLD VIP - Staging Worker Scheduler (5-minute canary)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mwvip-staging-worker-scheduler
  cancel-in-progress: false

jobs:
  invoke-staging-worker:
    # Explicitly opt in with repository variable STAGING_WORKER_SCHEDULER_ENABLED=true.
    # The Edge Function must separately have MWVIP_WORKER_ENABLED=true after Staging acceptance.
    if: ${{ vars.STAGING_WORKER_SCHEDULER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Validate Staging-only endpoint and secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_URL" || { echo "::error::Missing STAGING_SUPABASE_URL"; exit 1; }
          test -n "$SERVICE_ROLE_KEY" || { echo "::error::Missing STAGING_SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          python - "$STAGING_URL" <<'PY'
          import sys
          from urllib.parse import urlparse
          u=urlparse(sys.argv[1])
          if u.scheme != "https" or u.hostname != "awatzrapqrteybgspqlq.supabase.co" or u.path not in ("","/") or u.query or u.fragment:
              raise SystemExit("::error::Worker scheduler is restricted to the confirmed Staging project URL")
          print("Staging endpoint validated; secret values are not printed.")
          PY
          echo "::add-mask::$SERVICE_ROLE_KEY"
      - name: Invoke one bounded Staging worker cycle
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --fail-with-body \
            --max-time 90 \
            -X POST "$STAGING_URL/functions/v1/project-automation-worker" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{}')
          status=$(printf '%s' "$response" | jq -r '.status // empty')
          test -n "$status" || { echo "::error::Worker returned no status"; exit 1; }
          test "$status" != "disabled" || { echo "::error::Staging Worker is still disabled; do not enable scheduler until Staging acceptance is complete"; exit 1; }
          printf 'Staging worker cycle completed with status: %s\n' "$status"
          # Never print the response body, task input, or task result.
