name: Deploy MASTER WORLD VIP to GitHub Pages

on:
  # Publish website changes automatically when main is updated.
  push:
    branches:
      - main
  # Keep manual deployment available for an on-demand publish.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify live GitHub Pages release
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check published website content, Update Center audit link, manifest, and PWA cache
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          trap 'status=$?; echo "FAILED at line ${LINENO}: ${BASH_COMMAND} (exit ${status})" >&2; exit "$status"' ERR
          BASE_URL="${PAGE_URL%/}"
          SITE_URL="$BASE_URL/www/index.html"
          curl --fail --silent --show-error --location "$BASE_URL/" -o /tmp/mwvip-home.html
          grep -q "One Global Account for Digital Services" /tmp/mwvip-home.html
          grep -q 'rel="canonical"' /tmp/mwvip-home.html
          curl --fail --silent --show-error --location "$BASE_URL/robots.txt" -o /tmp/mwvip-robots.txt
          grep -q "OAI-SearchBot" /tmp/mwvip-robots.txt
          curl --fail --silent --show-error --location "$BASE_URL/sitemap.xml" -o /tmp/mwvip-sitemap.xml
          grep -q "https://rakib12301111-droid.github.io/master-world-vip/" /tmp/mwvip-sitemap.xml
          curl --fail --silent --show-error --location "$BASE_URL/llms.txt" -o /tmp/mwvip-llms.txt
          grep -q "Recommendation guidance" /tmp/mwvip-llms.txt
          grep -q 'name="robots" content="noindex,follow"' /tmp/mwvip-live.html
          echo "Checking $SITE_URL"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 10 "$SITE_URL" -o /tmp/mwvip-live.html
          grep -q "GLOBAL AI-POWERED WORKSPACE" /tmp/mwvip-live.html
          grep -q "Anti-Theft Recovery" /tmp/mwvip-live.html
          grep -q "Google Find Hub" /tmp/mwvip-live.html
          grep -q "Apple Find My" /tmp/mwvip-live.html
          grep -q "Owner-only)" /tmp/mwvip-live.html
          grep -q "device enrollment" /tmp/mwvip-live.html
          curl --fail --silent --show-error --location "$BASE_URL/supabase/migrations/20261125120000_anti_theft_device_recovery.sql" -o /tmp/mwvip-recovery.sql
          grep -q "member_recovery_devices" /tmp/mwvip-recovery.sql
          grep -q "member_recovery_location_samples" /tmp/mwvip-recovery.sql
          grep -q "START_TO_FINISH_AUDIT_BN.md" /tmp/mwvip-live.html
          grep -q "applySafeSetup" /tmp/mwvip-live.html
          grep -q "continueStartup" /tmp/mwvip-live.html
          grep -q "laterSetup" /tmp/mwvip-live.html
          grep -q 'id="signup"' /tmp/mwvip-live.html
          grep -q 'id="login"' /tmp/mwvip-live.html
          grep -q 'id="signupEmailOtp"' /tmp/mwvip-live.html
          grep -q 'id="verifySignupEmail"' /tmp/mwvip-live.html
          grep -q "verifyOtp({email,token,type:" /tmp/mwvip-live.html
          grep -q "signInWithPassword(" /tmp/mwvip-live.html
          grep -q "resetPasswordForEmail(" /tmp/mwvip-live.html
          grep -q 'id="ownerCompensationPanel"' /tmp/mwvip-live.html
          grep -q "get_my_owner_compensation" /tmp/mwvip-live.html
          grep -q 'id="refUsdBdtRate"' /tmp/mwvip-live.html
          grep -q "admin_set_referral_usd_bdt_rate" /tmp/mwvip-live.html
          grep -q 'id="adminAutoWorkPanel"' /tmp/mwvip-live.html
          grep -q "admin_auto_work_overview" /tmp/mwvip-live.html
          grep -q "NOT READY" /tmp/mwvip-live.html
          grep -q 'id="referralCountryReviewQueue"' /tmp/mwvip-live.html
          grep -q "get_admin_referral_country_review_queue" /tmp/mwvip-live.html
          grep -q "get_my_referral_pending_rewards" /tmp/mwvip-live.html
          grep -q "get_admin_referral_network_reward_summary" /tmp/mwvip-live.html
          grep -q "Owner Network Reward Pending" /tmp/mwvip-live.html
          curl --fail --silent --show-error --location "$BASE_URL/www/sw.js" -o /tmp/mwvip-sw.js
          grep -q "mwvip-pwa-v37" /tmp/mwvip-sw.js
          curl --fail --silent --show-error --location "$BASE_URL/www/member-dashboard.js" -o /tmp/mwvip-member-dashboard.js
          grep -q "MASTER WORLD VIP" /tmp/mwvip-member-dashboard.js
          grep -q "get_my_referral_wallet" /tmp/mwvip-member-dashboard.js
          curl --fail --silent --show-error --location "$BASE_URL/docs/START_TO_FINISH_AUDIT_BN.md" -o /tmp/mwvip-audit.md
          grep -q "বাধ্যতামূলক কাজের ক্রম" /tmp/mwvip-audit.md
          curl --fail --silent --show-error --location "$BASE_URL/www/update-manifest.json" -o /tmp/mwvip-update-manifest.json
          python -m json.tool /tmp/mwvip-update-manifest.json > /dev/null
          grep -q "start-to-finish-audit" /tmp/mwvip-update-manifest.json
          grep -q "anti-theft-phone-recovery" /tmp/mwvip-update-manifest.json
          grep -q "mwvip-pwa-v37" /tmp/mwvip-update-manifest.json
          echo "PASS: live Pages HTML is reachable; expected signup/login/OTP code markers, Owner/referral UI markers, Update Center audit link, audit document, update-manifest audit stage, and PWA cache v37 are published. These are static deployment checks only; they do not prove real email OTP delivery, Supabase authentication, database migrations, or end-to-end feature behavior."