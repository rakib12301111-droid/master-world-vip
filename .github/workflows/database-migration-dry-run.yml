name: MASTER WORLD VIP - Database Migration Safety Check

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

concurrency:
  group: master-world-vip-db-dry-run
  cancel-in-progress: false

jobs:
  migration-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Supabase credentials are configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::Missing repository Actions secret SUPABASE_ACCESS_TOKEN."; exit 1; }
          [[ "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_[A-Za-z0-9]+$ ]] || { echo "::error::SUPABASE_ACCESS_TOKEN must be a Supabase Personal Access Token."; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "::error::Missing repository Actions secret SUPABASE_DB_PASSWORD."; exit 1; }
          echo "Required secrets are present; values are not displayed."

      - name: Validate migration inventory
        run: |
          set -euo pipefail
          count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
          echo "Found $count SQL migration files."
          test "$count" -ge 17 || { echo "::error::Expected at least 17 migration files."; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the approved Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "lztbbrzeuyjkuiyzrsxp" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending database migrations only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase db push --dry-run
          echo "Dry run completed. No database migrations were applied."
