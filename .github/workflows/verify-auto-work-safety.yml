  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-work-static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify Auto Work security and readiness invariants
        run: python scripts/verify-admin-auto-work.py
