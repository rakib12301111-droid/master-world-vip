name: MASTER WORLD VIP - Auto Work Static Safety
# Triggered audit revision: provider approval matcher corrected in verify-admin-auto-work.py

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261125100000_admin_auto_work_control_plane.sql"
      - "supabase/migrations/20261125130000_admin_auto_work_claim_concurrency_fix.sql"
      - "www/index.html"
      - "scripts/verify-admin-auto-work.py"
      - "docs/ADMIN_AUTO_WORK_EARN_IMPLEMENTATION_BN.md"
      - "docs/MEMBER_AUTO_WORK_OWNER_COMMISSION_POLICY_BN.md"
      - "supabase/README.md"
      - ".github/workflows/verify-auto-work-safety.yml"
  pull_request:
    paths:
      - "supabase/migrations/20261125100000_admin_auto_work_control_plane.sql"
      - "supabase/migrations/20261125130000_admin_auto_work_claim_concurrency_fix.sql"
      - "www/index.html"
