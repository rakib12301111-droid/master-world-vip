name: MASTER WORLD VIP - Deploy Secure Update Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-update-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-world-vip-supabase-functions
  cancel-in-progress: false

jobs:
  deploy-update-functions:
    runs-on: ubuntu-latest
    # Secrets configured by the Owner setup panel are repository-level Actions
    # secrets. Do not bind this job to an Environment, which can shadow those
    # repository secrets with an Environment secret of the same name.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: lztbbrzeuyjkuiyzrsxp
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Supabase deploy is blocked: repository Actions secret SUPABASE_ACCESS_TOKEN is not available."
            echo "::error::Configure it through the Owner setup panel or GitHub Settings > Secrets and variables > Actions."
            echo "::error::Never put the token in app code, workflow inputs, or chat."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != "lztbbrzeuyjkuiyzrsxp" ]; then
            echo "::error::Project ref does not match the approved MASTER WORLD VIP project."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all MASTER WORLD VIP Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: lztbbrzeuyjkuiyzrsxp
        run: |
          set -euo pipefail
          for function_dir in supabase/functions/*/; do
            function_name="$(basename "$function_dir")"
            echo "Deploying $function_name"
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Confirm deployment commands completed
        run: echo "All configured MASTER WORLD VIP Edge Function deployment commands completed for the approved project."
