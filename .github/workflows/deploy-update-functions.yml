name: MASTER WORLD VIP - Deploy Secure Update Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/dispatch-db-update/**"
      - "supabase/functions/get-db-update-status/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-update-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-world-vip-supabase-functions
  cancel-in-progress: false

jobs:
  deploy-update-functions:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::Missing SUPABASE_PROJECT_REF"; exit 1; }
          if [ "$SUPABASE_PROJECT_REF" != "lztbbrzeuyjkuiyzrsxp" ]; then
            echo "::error::Project ref does not match the approved MASTER WORLD VIP project."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy authenticated Update Center functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy dispatch-db-update --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy get-db-update-status --project-ref "$SUPABASE_PROJECT_REF"

      - name: Confirm deployment commands completed
        run: echo "Supabase CLI deployment commands completed for the approved project."
