name: MASTER WORLD VIP - Deploy Secure Update Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-update-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-world-vip-supabase-functions
  cancel-in-progress: false

jobs:
  deploy-update-functions:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: lztbbrzeuyjkuiyzrsxp
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Supabase deploy is blocked: SUPABASE_ACCESS_TOKEN is not available to this production job."
            echo "::error::Add it at Settings > Secrets and variables > Actions (repository secret), or Settings > Environments > production (environment secret)."
            echo "::error::Create/copy the token from Supabase Account > Access Tokens. Never put it in app code, workflow inputs, or chat. A repository-level Actions secret is also available to this production job."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "SUPABASE_PROJECT_REF is not set; using the approved project ref."
            echo "SUPABASE_PROJECT_REF=lztbbrzeuyjkuiyzrsxp" >> "$GITHUB_ENV"
          fi
          if [ "$SUPABASE_PROJECT_REF" != "lztbbrzeuyjkuiyzrsxp" ]; then
            echo "::error::Project ref does not match the approved MASTER WORLD VIP project."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all MASTER WORLD VIP Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: lztbbrzeuyjkuiyzrsxp
        run: |
          set -euo pipefail
          for function_dir in supabase/functions/*/; do
            function_name="$(basename "$function_dir")"
            echo "Deploying $function_name"
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Confirm deployment commands completed
        run: echo "All configured MASTER WORLD VIP Edge Function deployment commands completed for the approved project."
