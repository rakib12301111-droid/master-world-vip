name: MASTER WORLD VIP - Safe Supabase Migration Deploy

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending database migrations to the approved production project"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      confirm_recoverable_backup:
        description: "Confirm a current recoverable Supabase backup exists before production changes"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: master-world-vip-supabase-migrations
  cancel-in-progress: false

jobs:
  migration-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secure deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: lztbbrzeuyjkuiyzrsxp
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::Missing repository Actions secret SUPABASE_ACCESS_TOKEN."; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "::error::Missing repository Actions secret SUPABASE_DB_PASSWORD."; exit 1; }
          test "$SUPABASE_PROJECT_REF" = "lztbbrzeuyjkuiyzrsxp" || { echo "::error::Unexpected Supabase project."; exit 1; }
          echo "Credentials are present; secret values are never printed."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify expected migration files
        run: |
          set -euo pipefail
          for migration in \
            202611180001_master_world_vip.sql \
            202611190001_global_community.sql \
            202611190002_privacy_rights.sql \
            20261119180000_admin_rbac_owner_control.sql \
            20261119190000_member_broadcast.sql \
            20261119200000_update_releases.sql \
            20261120100000_inbox_push_foundation.sql \
            20261120150000_membership_helper_hardening.sql \
            20261121100000_profiles_discovery_privacy_hardening.sql \
            20261121120000_facebook_setup_orders.sql \
            20261121130000_facebook_setup_feedback.sql \
            20261121140000_verified_payment_state.sql \
            20261121150000_sslcommerz_checkout_enable.sql \
            20261121160000_trusted_devices_login_history.sql \
            20261121170000_group_rls_recursion_fix.sql \\\n            20261121180000_member_verification_helpdesk.sql; do
            test -f "supabase/migrations/$migration" || { echo "::error::Missing required migration: $migration"; exit 1; }
          done

      - name: Preview pending production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: lztbbrzeuyjkuiyzrsxp
        run: |
          set -euo pipefail
          supabase db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Require backup confirmation before production changes
        if: inputs.apply_migrations == 'yes'
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_recoverable_backup }}" = "yes" || { echo "::error::Production migration blocked: confirm a recoverable Supabase backup first."; exit 1; }

      - name: Capture pre-migration schema snapshot
        if: inputs.apply_migrations == 'yes' && inputs.confirm_recoverable_backup == 'yes'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: db.lztbbrzeuyjkuiyzrsxp.supabase.co
          PGPORT: "5432"
          PGDATABASE: postgres
          PGUSER: postgres
          PGSSLMODE: require
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          pg_dump --schema-only --no-owner --no-privileges --file=mwvip-pre-migration-schema.sql
          test -s mwvip-pre-migration-schema.sql

      - name: Upload pre-migration schema snapshot
        if: inputs.apply_migrations == 'yes' && inputs.confirm_recoverable_backup == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: mwvip-pre-migration-schema-${{ github.run_id }}
          path: mwvip-pre-migration-schema.sql
          retention-days: 14
          if-no-files-found: error

      - name: Apply pending production migrations
        if: inputs.apply_migrations == 'yes' && inputs.confirm_recoverable_backup == 'yes'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: lztbbrzeuyjkuiyzrsxp
        run: |
          set -euo pipefail
          supabase db push --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          echo "Supabase CLI completed the pending migration push."

      - name: Report preview-only run
        if: inputs.apply_migrations != 'yes'
        run: echo "Preview only. No database changes were applied."

      - name: Report backup confirmation required
        if: inputs.apply_migrations == 'yes' && inputs.confirm_recoverable_backup != 'yes'
        run: echo "Production migration was blocked because recoverable-backup confirmation was not supplied."
