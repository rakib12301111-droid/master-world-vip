name: MASTER WORLD VIP - Encrypted Backup, Restore Test & Migration Preview
run-name: MASTER WORLD VIP DB Safety Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *' # Daily encrypted backup + isolated restore test (UTC)
  push:
    branches: [main]
    paths:
      - '.github/workflows/backup-restore-preview.yml'
      - '.github/workflows/secure-supabase-db-update.yml'
      - '.github/workflows/apply-supabase-migrations.yml'
      - '.github/workflows/test-two-member-rls.yml'
      - 'supabase/migrations/**'
      - 'supabase/audits/**'
      - 'supabase/config.toml'

permissions:
  contents: read

concurrency:
  group: master-world-vip-db-safety-pipeline
  cancel-in-progress: false

jobs:
  backup-restore-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      restore-db:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: restore_test_only
          POSTGRES_DB: mwvip_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d mwvip_restore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets and identify connection type without printing credentials
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "::error::Missing Actions secret SUPABASE_DB_URL."; exit 1; }
          test -n "${BACKUP_ENCRYPTION_PASSPHRASE:-}" || { echo "::error::Missing Actions secret BACKUP_ENCRYPTION_PASSPHRASE. Set a strong unique passphrase in repository Actions secrets."; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          raw = os.environ["SUPABASE_DB_URL"].lstrip("\ufeff").strip()
          had_key_label = raw.startswith("SUPABASE_DB_URL=")
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ('"', "'"):
              raw = raw[1:-1].strip()
          if raw.startswith("SUPABASE_DB_URL="):
              raw = raw.split("=", 1)[1].strip().strip(chr(34) + chr(39))
          # Emit only booleans/counts; never print the URI, authority, username,
          # password, query, fragment, or any extracted credential.
          has_postgres_prefix = raw.startswith(("postgresql://", "postgres://"))
          has_newline = any(ch in raw for ch in (chr(10), chr(13)))
          try:
              parsed = urlsplit(raw)
              hostname = parsed.hostname
              hostname_error = False
          except ValueError:
              parsed = None
              hostname = None
              hostname_error = True
          authority = parsed.netloc if parsed is not None else ""
          print(
              "Safe SUPABASE_DB_URL diagnostics: "
              f"nonempty={bool(raw)}; length={len(raw)}; "
              f"postgres_scheme_prefix={has_postgres_prefix}; "
              f"key_label_prefix={had_key_label}; embedded_newline={has_newline}; "
              f"authority_present={bool(authority)}; "
              f"authority_has_at={('@' in authority)}; "
              f"authority_at_count={authority.count('@')}; "
              f"hostname_present={bool(hostname)}; "
              f"hostname_parse_error={hostname_error}; "
              f"path_is_postgres={bool(parsed and parsed.path.lstrip('/') == 'postgres')}; "
              f"query_present={bool(parsed and parsed.query)}; "
              f"fragment_present={bool(parsed and parsed.fragment)}."
          )
          if parsed is None or parsed.scheme not in ("postgres", "postgresql"):
              raise SystemExit("::error::SUPABASE_DB_URL could not be parsed as a PostgreSQL URI; check URI delimiters and percent-encoding without sharing the secret.")
          if not hostname:
              raise SystemExit("::error::SUPABASE_DB_URL has no parseable URI hostname/authority; check URI structure and percent-encode reserved password characters.")
          host = hostname.lower()
          if not host.endswith(".pooler.supabase.com"):
              # Hostname is not a credential; showing it helps identify Direct vs Session Pooler safely.
              print(f"Detected database host type: non-pooler ({host}).")
              raise SystemExit("::error::GitHub Actions backup requires the IPv4-compatible Session Pooler host, for example aws-0-ap-south-1.pooler.supabase.com. Direct db.<project>.supabase.co is not accepted by this workflow.")
          if parsed.port != 5432 or parsed.path.lstrip("/") != "postgres":
              raise SystemExit("::error::Session Pooler URI must use port 5432 and database path /postgres.")
          if not parsed.username or not parsed.password:
              raise SystemExit("::error::Session Pooler URI is missing username or password.")
          print(f"Detected Supabase Session Pooler host: {host}; URI structure is valid.")
          PY
          echo "Required secret values were checked and never printed."

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          pg_dump --version
          pg_restore --version

      - name: Parse and validate Session Pooler URI without exposing credentials
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote

          raw = os.environ["SUPABASE_DB_URL"].lstrip("\ufeff").strip()
          # Normalize common copy/paste wrappers without exposing the secret.
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ('"', "'"):
              raw = raw[1:-1].strip()
          if raw.startswith("SUPABASE_DB_URL="):
              raw = raw.split("=", 1)[1].strip().strip("\\\"'")
          parsed = urlsplit(raw)
          if parsed.scheme not in ("postgres", "postgresql"):
              raise SystemExit("::error::SUPABASE_DB_URL is not a PostgreSQL URI. Check that the secret starts with postgresql:// and contains no label or extra text.")
          if not parsed.hostname or not parsed.hostname.endswith(".pooler.supabase.com"):
              raise SystemExit("::error::SUPABASE_DB_URL host is not a Supabase Session Pooler host.")
          if parsed.port != 5432:
              raise SystemExit("::error::Session Pooler URI must use port 5432.")
          if parsed.path.lstrip("/") != "postgres":
              raise SystemExit("::error::Session Pooler URI database path must be /postgres.")
          username = unquote(parsed.username or "")
          password = unquote(parsed.password or "")
          if not username or not password or any(ch in username + password for ch in "\r\n"):
              raise SystemExit("::error::Session Pooler URI is missing valid username/password credentials.")
          # The full URI secret is masked by GitHub, but extracted credentials
          # are separate values and must be masked before any later command.
          print(f"::add-mask::{password}", flush=True)
          print(f"::add-mask::{username}", flush=True)
          values = {
              "PGHOST": parsed.hostname,
              "PGPORT": str(parsed.port),
              "PGDATABASE": parsed.path.lstrip("/"),
              "PGUSER": username,
              "PGPASSWORD": password,
              "PGSSLMODE": "require",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={value}\n")
              env_file.write(f"SUPABASE_DB_URL={raw}\n")
          print("Session Pooler URI parsed successfully; credentials were not printed.")
          PY

      - name: Create encrypted full logical backup
        id: backup
        run: |
          set -euo pipefail
          mkdir -p backup
          SERVER_VERSION="$(psql --no-psqlrc --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" --dbname="$PGDATABASE" -v ON_ERROR_STOP=1 -Atc 'show server_version_num')"
          CLIENT_VERSION="$(pg_dump --version | awk '{print $3}' | cut -d. -f1)"
          SERVER_MAJOR="$((SERVER_VERSION / 10000))"
          test "$CLIENT_VERSION" -ge "$SERVER_MAJOR" || { echo "::error::pg_dump client major version $CLIENT_VERSION is older than server major version $SERVER_MAJOR."; exit 1; }
          echo "PostgreSQL server major: $SERVER_MAJOR; pg_dump client major: $CLIENT_VERSION."
          pg_dump --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" --dbname="$PGDATABASE" --format=custom --no-owner --no-acl --file=backup/master-world-vip.dump
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in backup/master-world-vip.dump \
            -out backup/master-world-vip.dump.enc \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          rm -f backup/master-world-vip.dump
          test -s backup/master-world-vip.dump.enc
          echo "backup_reference=mwvip-logical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "Encrypted logical backup created; plaintext dump removed from the runner."

      - name: Decrypt backup inside isolated runner and restore to disposable test database
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in backup/master-world-vip.dump.enc \
            -out backup/restore-test.dump \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          test -s backup/restore-test.dump
          # Restore into a fresh template0 database. The Supabase service's
          # default database is pre-populated with platform schemas (for
          # example auth), which would collide with schemas in the backup.
          PGPASSWORD=restore_test_only PGSSLMODE=disable createdb \
            --host=127.0.0.1 --port=5432 --username=supabase_admin \
            --template=template0 mwvip_restore_empty
          PGPASSWORD=restore_test_only PGSSLMODE=disable pg_restore \
            --host=127.0.0.1 --port=5432 --username=supabase_admin \
            --dbname=mwvip_restore_empty --no-owner --no-acl \
            --exit-on-error backup/restore-test.dump
          PGPASSWORD=restore_test_only PGSSLMODE=disable psql -h 127.0.0.1 -U supabase_admin -d mwvip_restore_empty \
            -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema not in ('pg_catalog','information_schema')" \
            > backup/restored_table_count.txt
          test "$(cat backup/restored_table_count.txt)" -gt 0
          rm -f backup/restore-test.dump
          echo "Restore test succeeded in the disposable PostgreSQL service; production was not modified."

      - name: Inspect remote migration history without changing it
        id: migration_history
        run: |
          set -euo pipefail
          npx --yes supabase@latest migration list --remote "$SUPABASE_DB_URL"
          echo "Read-only migration history inspection complete; no history entries were changed."

      - name: Preview all pending production migrations
        id: migration_preview
        run: |
          set -euo pipefail
          npx --yes supabase@latest db push --dry-run --remote "$SUPABASE_DB_URL"

      - name: Upload encrypted backup and non-secret test report
        if: always() && steps.backup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: master-world-vip-encrypted-backup-${{ github.run_id }}
          path: |
            backup/master-world-vip.dump.enc
            backup/restored_table_count.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Print non-secret references for the migration approval record
        if: always() && steps.backup.outcome == 'success'
        env:
          BACKUP_REFERENCE: ${{ steps.backup.outputs.backup_reference }}
          MIGRATION_PREVIEW_OUTCOME: ${{ steps.migration_preview.outcome }}
        run: |
          set -euo pipefail
          echo "BACKUP_REFERENCE=$BACKUP_REFERENCE"
          echo "RESTORE_TEST_REFERENCE=github-actions-run-${GITHUB_RUN_ID}"
          echo "BACKUP_AND_RESTORE=success"
          echo "MIGRATION_PREVIEW=${MIGRATION_PREVIEW_OUTCOME:-not-run}"
          if [ "${MIGRATION_PREVIEW_OUTCOME:-}" = "success" ]; then
            echo "Migration preview passed. Production migrations were NOT applied by this workflow."
          else
            echo "Migration preview did not pass. This reference record is informational only; production migrations were NOT applied."
          fi
