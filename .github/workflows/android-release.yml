name: Build signed MASTER WORLD VIP Android release

on:
  workflow_dispatch:
    inputs:
      confirm_signed_release:
        description: "Build a signed release APK using the repository signing secrets"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: master-world-vip-android-release
  cancel-in-progress: false

jobs:
  signed-release:
    if: inputs.confirm_signed_release == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "${KEYSTORE_PASSWORD:-}" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "${KEY_ALIAS:-}" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "${KEY_PASSWORD:-}" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }
          echo "Android signing secrets are present; values will not be printed."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore signing key securely
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/mwvip-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mwvip-signing/release.jks"
          test -s "$RUNNER_TEMP/mwvip-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/mwvip-signing/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mwvip-signing/release.jks" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed release APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: master-world-vip-signed-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
