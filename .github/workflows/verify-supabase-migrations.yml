name: Verify Supabase migration safety

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/stage-server-code/index.ts"
      - "supabase/audits/**"
      - "scripts/verify-membership-helper-migration.py"
      - "scripts/verify-community-live-readiness.py"
      - "scripts/verify-inline-js.py"
      - "scripts/verify-live-service-health.py"
      - "scripts/verify-global-communication.py"
      - "scripts/verify-emergency-games.py"
      - "scripts/verify-helpline-directory.py"
      - "scripts/verify-crisis-alerts.py"
      - "scripts/verify-global-country-directory.py"
      - "scripts/verify-push-sender.py"
      - "scripts/verify-referral-rewards.py"
      - "scripts/verify-owner-compensation.py"
      - "scripts/verify-work-earn-finance.py"
      - "scripts/verify-4000-project-registry.py"
      - "scripts/verify-project-automation-engine.py"
      - "scripts/verify-plan-customer-order-gates.py"
      - "scripts/verify-member-finance-ledger.py"
      - "scripts/verify-member-payout-refund.py"
      - "scripts/verify-admin-dashboard.py"
      - "www/admin-dashboard.js"
      - "www/data/helplines-BD.json"
      - "www/index.html"
      - "www/sw.js"
      - "android-app/**"
      - ".github/workflows/apply-supabase-migrations.yml"
      - ".github/workflows/accrue-owner-compensation.yml"
      - ".github/workflows/audit-supabase-indexes-rls.yml"
      - ".github/workflows/test-two-member-rls.yml"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/verify-supabase-migrations.yml"
      - "docs/EMERGENCY_OFFLINE_SATELLITE_GAMES.md"
      - "docs/GLOBAL_COMMUNICATION_OFFLINE_NEWS_ROADMAP.md"
      - "docs/COMMUNITY_LIVE_READINESS.md"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/stage-server-code/index.ts"
      - "supabase/audits/**"
      - "scripts/verify-membership-helper-migration.py"
      - "scripts/verify-community-live-readiness.py"
      - "scripts/verify-inline-js.py"
      - "scripts/verify-live-service-health.py"
      - "scripts/verify-global-communication.py"
      - "scripts/verify-emergency-games.py"
      - "scripts/verify-helpline-directory.py"
      - "scripts/verify-crisis-alerts.py"
      - "scripts/verify-global-country-directory.py"
      - "scripts/verify-push-sender.py"
      - "www/data/helplines-BD.json"
      - "www/index.html"
      - "www/sw.js"
      - "android-app/**"
      - ".github/workflows/apply-supabase-migrations.yml"
      - ".github/workflows/accrue-owner-compensation.yml"
      - ".github/workflows/audit-supabase-indexes-rls.yml"
      - ".github/workflows/test-two-member-rls.yml"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/verify-supabase-migrations.yml"
      - "docs/COMMUNITY_LIVE_READINESS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-migration-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify inline JavaScript syntax
        run: python scripts/verify-inline-js.py
      - name: Verify membership helper migration
        run: python scripts/verify-membership-helper-migration.py
      - name: Verify 4,000-project registry safety
        run: python scripts/verify-4000-project-registry.py
      - name: Verify central project automation engine safety
        run: python scripts/verify-project-automation-engine.py
      - name: Verify Free/Paid plans and customer order funding gates
        run: python scripts/verify-plan-customer-order-gates.py
      - name: Verify append-only double-entry finance ledger
        run: python scripts/verify-member-finance-ledger.py
      - name: Verify Member payout and refund safety
        run: python scripts/verify-member-payout-refund.py
      - name: Verify server-authorized Admin dashboard
        run: python scripts/verify-admin-dashboard.py
      - name: Verify community live readiness
        run: python scripts/verify-community-live-readiness.py
      - name: Verify Owner-only live service health
        run: python scripts/verify-live-service-health.py
      - name: Verify offline, voice and country news features
        run: python scripts/verify-global-communication.py
      - name: Verify offline emergency and games
        run: python scripts/verify-emergency-games.py
      - name: Verify official helpline directory
        run: python scripts/verify-helpline-directory.py
      - name: Verify global crisis news and alerts
        run: python scripts/verify-crisis-alerts.py
      - name: Verify all-country directory
        run: python scripts/verify-global-country-directory.py
      - name: Verify push sender security
        run: python scripts/verify-push-sender.py
      # Includes payout reference uniqueness, Paid audit metadata, and Owner/member wallet isolation checks.
      - name: Verify referral reward security
        run: python scripts/verify-referral-rewards.py
      - name: Verify Owner compensation ledger security
        run: python scripts/verify-owner-compensation.py
      - name: Verify Work & Earn wallet and Owner profit security
        if: always()
        run: python scripts/verify-work-earn-finance.py
