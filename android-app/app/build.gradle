plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

if (releaseBuildRequested) {
    def requiredSigningVariables = [
        "ANDROID_KEYSTORE_PATH",
        "ANDROID_KEYSTORE_PASSWORD",
        "ANDROID_KEY_ALIAS",
        "ANDROID_KEY_PASSWORD"
    ]
    def missingSigningVariables = requiredSigningVariables.findAll {
        !System.getenv(it)?.trim()
    }
    if (!missingSigningVariables.isEmpty()) {
        throw new GradleException(
            "Refusing to configure a release build without signing configuration. Missing: " +
            missingSigningVariables.join(", ")
        )
    }
    if (!file(releaseKeystorePath).isFile()) {
        throw new GradleException("Refusing to build release APK: configured Android keystore file does not exist.")
    }
}

android {
    namespace 'com.masterworldvip.app'
    compileSdk 35

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    defaultConfig {
        applicationId 'com.masterworldvip.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}
